[package]
name = "wmde-bg"
version = "1.2.0"
edition = "2024"
rust-version = "1.93"

[features]
default = ["avif"]
avif = ["image/avif-native"]

[dependencies]
color-eyre = "0.6.5"
colorgrad = { workspace = true }
wmde-bg-config = { path = "./config" }
eyre = "0.6.12"
fast_image_resize = { version = "6.0.0", features = ["image"] }
image = { workspace = true, features = ["hdr", "jpeg", "png", "rayon", "webp"] }
rayon = "1.12"
jxl-oxide = { version = "0.12.6", features = ["image"] }
notify = "8.2.0"
rand = "0.10"
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }
tracing = { workspace = true }
tracing-subscriber = "0.3.23"
walkdir = "2.5"

[workspace]
members = ["config"]

[workspace.dependencies]
colorgrad = "0.8.0"
image = { version = "0.25.10", default-features = false }
tracing = "0.1.44"

[dependencies.cosmic-config]
git = "https://github.com/pop-os/libcosmic"
features = ["calloop"]

# Build against the WMDE libcosmic fork (config root cosmic -> wmde, icon theme WMDE).
# Local path patch. The patched libcosmic crates keep their upstream names/dirs
# (cosmic-config etc.); our own config crate IS renamed cosmic-bg-config -> wmde-bg-config.
[patch."https://github.com/pop-os/libcosmic"]
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
iced_core = { path = "../libcosmic/iced/core" }
iced_futures = { path = "../libcosmic/iced/futures" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"
