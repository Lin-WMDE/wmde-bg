# Один конфиг nFPM на оба формата. Стейджинг готовит `just package-staging`,
# версию всегда подставляет just через env WMDE_VERSION (см. justfile).
# ВАЖНО: только ${WMDE_VERSION} без :-дефолта — nFPM раскрывает env через
# os.ExpandEnv и :- не понимает (версия молча станет 0.0.0~rc0).
name: wmde-bg
arch: amd64
version: ${WMDE_VERSION}
release: 1
maintainer: WMDE <wmde@wmde.fun>
description: |-
  WMDE wallpaper daemon (fork of cosmic-bg)
  Draws the fun.wmde.Background wallpaper; default image ships here,
  the choice of image lives in wmde-themes.
homepage: https://wmde.fun
license: MPL-2.0
section: x11

# Как в PKGBUILD: wayland/xkbcommon напрямую, dav1d под AVIF-декодинг
# (остальные кодеки — статические Rust-крейты).
depends:
  - libc6 | glibc
  - libgcc-s1 | libgcc
  - libxkbcommon0
  - libwayland-client0
  - libdav1d7

contents:
  - src: target/staging/usr/bin/wmde-bg
    dst: /usr/bin/wmde-bg
    file_info: { mode: 0755 }
  - src: target/staging/usr/share/backgrounds/wmde/wmde-default.jpg
    dst: /usr/share/backgrounds/wmde/wmde-default.jpg
    file_info: { mode: 0644 }
  # doc (copyright + changelog.Debian.gz) готовит just package-doc.
  # Только для deb: в rpm нет %doc-разметки у nFPM,
  # а лицензия и changelog там и так есть (License-тег + %changelog).
  - src: target/staging/usr/share/doc/wmde-bg/
    dst: /usr/share/doc/wmde-bg/
    type: tree
    packager: deb

# %changelog для rpm генерит just package-staging (иначе E: no-changelogname-tag).
# Путь от корня репо: nFPM резолвит его от cwd, а не от каталога конфига.
changelog: target/changelog.yaml

overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libxkbcommon0
      - libwayland-client0
      - libdav1d7
  rpm:
    # SONAME вместо имён пакетов: имена расходятся между
    # Fedora и openSUSE, а SONAME предоставляют обе семьи.
    depends:
      - libc.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libdav1d.so.7()(64bit)
